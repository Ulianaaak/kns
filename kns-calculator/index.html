<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Калькулятор КНС</title>
    <link rel="stylesheet" href="css/style.css">

    <script src="kns/index.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>
<div class="card">
    <h1>Расчёт КНС</h1>
    <form id="kns-form" onsubmit="return false;">
        <fieldset>
            <legend>1. Исходные данные</legend>
            <div class="field"><label>Производительность, Q (м³/ч)</label><input type="number" id="q_m3h" step="0.01"></div>
            <div class="field"><label>Напор на выходе, H<sub>треб</sub> (м.в.ст.)</label><input type="number" id="h_req" step="0.1"></div>
            <div class="field"><label>Глубина подводящего, H<sub>подвод</sub> (м)</label><input type="number" id="h_in_depth" step="0.1"></div>
            <div class="field"><label>Глубина отводящего, H<sub>отвод</sub> (м)</label><input type="number" id="h_out_depth" step="0.1"></div>
        </fieldset>

        <fieldset>
            <legend>2. Схема работы насосных агрегатов</legend>
            <div class="field"><label>Рабочих агрегатов</label><input type="number" id="n_work" min="1"></div>
            <div class="field"><label>Резервных агрегатов</label><input type="number" id="n_res" min="0"></div>
            <div class="field"><label>На склад (сухой запас)</label><input type="number" id="n_stock" min="0"></div>
        </fieldset>

        <fieldset>
            <legend>3. Расчётные характеристики насосных агрегатов</legend>
            <div class="field"><label>Габарит улитки насоса, D (мм)</label><input type="number" id="d_pump" step="1"></div>
            <div class="field"><label>Длина насоса с муфтой (мм)</label><input type="number" id="l_pump" step="1"></div>
            <div class="field"><label>Мин. уровень воды в КНС (мм)</label><input type="number" id="h_min_water" step="1"></div>
            <div class="field"><label>DN автоматической трубной муфты (мм)</label><input type="number" id="dn_coupling" step="1"></div>
            <div class="field"><label>Потери на трение (м.в.ст.)</label><input type="number" id="h_friction" step="0.001"></div>
            <div class="field"><label>Потери на местные сопротивления (м.в.ст.)</label><input type="number" id="h_local" step="0.01"></div>
        </fieldset>

        <fieldset>
            <legend>4. Геометрические параметры корпуса КНС</legend>
            <div class="field"><label>Диаметр корпуса внутренний (мм)</label><input type="number" id="d_inner" step="1"></div>
            <div class="field"><label>Высота рамы под насосные агрегаты (мм)</label><input type="number" id="h_ram" step="1"></div>
            <div class="field"><label>Недостающая высота для сборного ЖБ (мм)</label><input type="number" id="h_extra" step="1"></div>
        </fieldset>

        <fieldset>
            <legend>5. Расчёт полезного объёма КНС</legend>
            <div class="field"><label>Время цикла работы насоса, T (мин)</label><input type="number" id="t_min" step="0.1"></div>
            <div class="field"><label>Конструктивно необх. доп. высота (мм)</label><input type="number" id="h_konstr" step="1"></div>
        </fieldset>

        <button type="button" id="btn-calc">Рассчитать</button>
    </form>

    <div id="result" class="result" style="display:none;"></div>
</div>
</body>
</html>
